; XiaoXi AI Robot - PlatformIO
; Default target: ESP32-S3-WROOM-1 N16R8 (16MB flash, 8MB OPI PSRAM)
; Legacy fallback: env:esp32dev (ESP32 DevKit, same firmware source)

[platformio]
src_dir = ESP32_XiaoXi_Client
default_envs = esp32-s3-devkitc-1

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    bodmer/TFT_eSPI@^2.5.43
    madhephaestus/ESP32Servo@^3.0.9
    paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8
    links2004/WebSockets@^2.6.1
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_RGB_ORDER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=20000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DUSE_FSPI_PORT=1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=4
    -DTFT_DC=15
    -DTFT_RST=9
    -DTFT_BL=14
    -DTOUCH_CS=5

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTOUCH_CS=13
